name: Xbox UWP Build Draft (Evaluation Only)

# DRAFT: Prepared for evaluation in milestone XBOX-UWP-FEASIBILITY-1.
# Do NOT push or activate until authorized.

on:
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-uwp
          key: uwp-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure CMake for UWP x64
        shell: cmd
        run: |
          cmake -S . -B build-uwp -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_SYSTEM_NAME=WindowsStore ^
            -DCMAKE_SYSTEM_VERSION=10.0 ^
            -DMZM_PLATFORM_UWP=ON ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build MZMRecomp UWP
        shell: cmd
        run: |
          cmake --build build-uwp --config Release --target MZMRecomp

      - name: Stage MSIX Packaging Layout
        shell: cmd
        run: |
          mkdir dist\staging
          copy build-uwp\Release\MZMRecomp.exe dist\staging\
          copy assets\uwp\Package.appxmanifest dist\staging\AppxManifest.xml
          mkdir dist\staging\assets\icons
          copy assets\icons\*.png dist\staging\assets\icons\
          mkdir dist\staging\configs
          copy configs\mzm-us.toml dist\staging\configs\

      - name: Create Self-Signed Test Certificate & Pack
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=MZMRecompiledDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "MZM Recompiled Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfxPassword = ConvertTo-SecureString -String "TestPassword123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath dist\dev.pfx -Password $pfxPassword
          Export-Certificate -Cert $cert -FilePath dist\dev.cer
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\MakeAppx.exe" pack /d dist\staging /p dist\MZMRecompiled-Xbox-UWP-x64.msix /nv
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\SignTool.exe" sign /fd SHA256 /a /f dist\dev.pfx /p TestPassword123 dist\MZMRecompiled-Xbox-UWP-x64.msix

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MZMRecompiled-Xbox-UWP-x64
          path: |
            dist/MZMRecompiled-Xbox-UWP-x64.msix
            dist/dev.cer
