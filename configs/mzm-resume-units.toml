# Reviewed resume units (M4-RESUME-2), MZM USA rev 0.
#
# runtime_should_yield() unwinds at the next instruction prologue after a VBlank
# start and the outer loop re-dispatches R15 there, so a function that can
# outlast a frame needs a static resume alias at every decoded instruction.
# static_resume_all does that for the whole ROM (233,709 dispatch rows against
# 28,670, including code nobody has audited) and is NOT used. A unit lists a
# function, or a small set of functions, that was reviewed against the safety
# contract in scripts/expand-resume-units.py (a resume PC can be entered with
# only g_cpu, CPSR, guest memory and guest-visible runtime state).
#
# THIS FILE is the source of truth. The per-instruction PCs are derived by
# scripts/expand-resume-units.py from the recompiler's own decode and passed to
# gba_recompile as an overlay (scripts/generate-m1.sh). Never list PCs by hand.
#
#   name    unit id
#   start   first function root (must be a generated function entry)
#   end     exclusive end; every function rooted inside must decode only inside
#   mode    "thumb" | "arm"
#   reason  why this unit yields: what outlasts a frame

[[resume_unit]]
name = "InitializeGame"
start = 0x080006A0
end = 0x080007C4
mode = "thumb"
reason = "DMA3 clears EWRAM (0x10000 words) and IWRAM; the first outlasts a frame after the NES quit restarts MZM (first miss 0x080006CA)"

[[resume_unit]]
name = "sram"
start = 0x080051D4
end = 0x08005368
mode = "thumb"
reason = "sram.c: MZM save init reads/writes/verifies all 32 KiB SRAM byte by byte with wait states over several frames; includes the two routines the game copies to the stack (first misses 0x080051EE, 0x08005280)"

[[resume_unit]]
name = "InitializeAudio"
start = 0x08002564
end = 0x080027F8
mode = "thumb"
reason = "audio engine setup after the NES quit restarts MZM; runs across a frame boundary (first miss 0x0800271C). Audited: 14 generated functions (root + bl continuations), 260 instructions ending at 0x0800276A then literal pool; no SWI/MSR/MRS, one BL pair, ldm/stm on r13 are single blocks; MMIO SOUNDCNT/DMA3/IE only"

[[resume_unit]]
name = "RoomSetInitialTilemap"
start = 0x08056B28
end = 0x08056D18
mode = "thumb"
reason = "room load: nested CPU loops writing the BG tilemap outlast a frame (first miss 0x08056C50; ablation: without the unit the NES-3 loader chain fails with LZ77 did not return to loader continuation). Audited: 20 generated functions, 220 instructions, BL pairs + ldm/stm on r13 + one bx return, no SWI/MSR/MRS"

[[resume_unit]]
name = "RoomRleDecompress"
start = 0x08056D18
end = 0x08056E28
mode = "thumb"
reason = "room load: RLE decompression of room data to RAM outlasts a frame (first miss 0x08056D90; ablation: without the unit the NES-3 chain misses at frame 3202). Audited: 22 generated functions, 133 instructions, one BL pair, ldm/stm on r13 and one bx return, no SWI/MSR/MRS"

[[resume_unit]]
name = "InitAndLoadGenerics"
start = 0x0800CBAC
end = 0x0800CDE8
mode = "thumb"
reason = "boot graphics load: 20 BL calls (DMA/decompress) per pass outlast a frame (first miss 0x0800CC68; ablation: without the unit the NES-3 loader chain fails with LZ77 did not return to loader continuation). Audited: 29 generated functions, 219 instructions, contract holds, no SWI/MSR/MRS"

[[resume_unit]]
name = "BitFill"
start = 0x080032B4
end = 0x08003380
mode = "thumb"
reason = "DMA-based fill/clear utility used across the game; each DMA3 chunk outlasts a frame (first miss 0x0800331A, the read-back after the DMA start; ablation: without the unit the NES-3 post-reset run stops at frame 4390 at this PC, caller 0x08056D57). Audited: 9 generated functions, 95 instructions, three literal pools inside the range (not published), ldm/stm on r13 and one bx r0 return only; registers r8-r12 live in g_cpu"

[[resume_unit]]
name = "SaveFileScan"
start = 0x080743A4
end = 0x0807478C
mode = "thumb"
reason = "boot SRAM validation (SramRead_All -> unk_743a4 -> unk_74574 -> unk_74624): per save slot two 32-bit checksum passes over an EWRAM SaveFile, three text compares and BitFill/DMA repairs outlast a frame only when the SRAM already holds MZM data, i.e. every boot after the first (first miss 0x08074698 inside unk_74624, caller 0x0807457D, frame 9 of a cold boot that loads a persisted cartridge image; ablation: without the unit that boot stops there). Fresh-SRAM boots never hit it. Audited: 3 functions unk_743a4/unk_74574/unk_74624, pure EWRAM arithmetic, BL pairs, ldm/stm on r13, no SWI/MSR/MRS"
