# Metroid: Zero Mission (USA, BMXE, revision 0)
# M0.5 static-analysis baseline for the verified 8 MiB USA cartridge.
#
# This is deliberately minimal. Reviewed data ranges, decomp function seeds,
# and the confirmed IRQ code copy are supplied by the generated
# symbols/BMXE_symbols.toml overlay. Runtime-only settings are added later.

[program]
name = "Metroid: Zero Mission (USA)"
id = "BMXE"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x08000000

# We already have a byte-matching decomp with authoritative function seeds.
# Prefer explicit evidence over speculative pointer-looking literals.
speculative_literal_harvest = false

# Stable sharding keeps generation/build iterations practical.
codegen_shards = 16

[identity]
sha1 = "5de8536afe1f0078ee6fe1089f890e8c7aa0a6e8"

# Fixed gameplay code copy.
#
# ClipdataSetupCode() copies 0x280 bytes starting at
# ClipdataConvertToCollision into gNonGameplayRam.inGame.clipdataCode.
# clipdataCode is the first field of gNonGameplayRam, so its runtime
# address is exactly 0x030016C4.
[[code_copy]]
runtime_start = 0x030016C4
source_start = 0x08057F7C
size = 0x280
name = "clipdataCode"
note = "MZM: ClipdataConvertToCollision copied to gNonGameplayRam.inGame.clipdataCode"

[[extra_func]]
addr = 0x030016C4
mode = "thumb"
name = "clipdatacode_entry"
note = "entry of the fixed clipdataCode RAM copy"

# Escape HBlank callback: DMA copies 0x40 bytes, while decoded instructions
# end before the literal pool. Ordinary static dispatch must never enter it.
[[extra_func]]
addr = 0x03001730
source_addr = 0x08087938
mode = "thumb"
name = "chozodia_hblank_ram"
dispatch = false
note = "byte-verified Chozodia Escape HBlank RAM image"

[[extra_func]]
addr = 0x087D8000
mode = "arm"
name = "nes_rom_trampoline"

[[extra_func]]
addr = 0x087D80D4
mode = "arm"
name = "nes_rom_loader"
returns = false

[[extra_func]]
addr = 0x087D8124
mode = "arm"
name = "nes_rom_reset_arm"

[[extra_func]]
addr = 0x087D812C
mode = "thumb"
name = "nes_rom_reset_thumb"

[[executable_image]]
id = "nes_payload"
path = ".local/nes-payload-usa.bin"
load_address = 0x03007400
size = 0x214
sha256 = "e94f6dba7b7ec0dd183335fa2efdd5bb5a1f4dc1f7593d8e8961b1e2ce681f44"
note = "NES Metroid derived ARM payload decompressed into IWRAM via BIOS LZ77"

[[data_range]]
start = 0x03007450
end = 0x03007458
note = "NES payload literal pool"

[[data_range]]
start = 0x03007560
end = 0x03007614
note = "NES payload literal pool and DMA tables"

[[extra_func]]
addr = 0x03007400
mode = "arm"
name = "nes_payload_entry"
dispatch = false
note = "NES payload entry, gated by IWRAM byte verification"

[[extra_func]]
addr = 0x03007458
mode = "arm"
name = "nes_payload_dma_loop"
dispatch = false
note = "NES payload DMA loop entry"

[[extra_func]]
addr = 0x030074E4
mode = "arm"
name = "nes_payload_dma_finish"
dispatch = false
note = "NES payload DMA finish entry"

# M4-RESUME-1: InitializeGame VBlank interior resumes.
#
# runtime_should_yield() unwinds at the NEXT instruction prologue after a VBlank
# start (User/System mode, IRQ depth 0). InitializeGame clears EWRAM (DMA3,
# 0x10000 words, more than one frame) and IWRAM, so after the NES emulator quits
# and MZM restarts the yield lands at 0x080006CA and the outer loop re-dispatches
# it. Every decoded instruction of InitializeGame [0x080006A0,0x080007C4) and of
# its bl-continuation functions can be that PC, so each interior instruction is
# a thin resume alias of its containing function (roots are unchanged). Only
# instruction boundaries: the literal pools are not listed. Not [[resume_range]]
# (it re-roots the start without its symbol name and seeds the pool words) and
# not static_resume_all (whole program). tests/m4/test_resume.py checks this list
# against the decoded instructions of the generated bodies.

