# M4-RESUME-1: MZM's sram.c [0x080051D4,0x08005368). MZM's save initialisation
# reads/writes/verifies the whole 32 KiB SRAM byte by byte with wait states (more
# than one frame per pass), so the VBlank yield lands inside these loops and the
# outer loop re-dispatches ROM interior PCs (first seen 0x080051EE, then
# 0x08005280). SramWriteUncheckedInternal and SramCheckInternal are also the two
# routines copied to the stack (the stack-helper hook runs their position
# independent ROM translation, whose guest PCs are the ROM addresses). Every
# interior instruction of each function of the unit is a resume alias of its
# own function; roots and literal pools are untouched.

