# NES emulator executable images (M4 NES-2).
#
# Images are reconstructed locally from the legal ROM by
# scripts/extract-nes-emulator.py (.local/nes-emulator/partN.bin, never
# committed). The image/data/seed blocks below are generated by
# scripts/derive-nes-emulator-map.py --parts part1,part3,part4,part5,part6 from a
# locally built nested decomp ELF used only as an address/mode oracle (no ROM
# bytes are committed).
#
# Part 2 (IWRAM 0x03000000..0x03005A4C) is intentionally NOT declared yet: its
# runtime addresses alias MZM's own IWRAM code_copy entries (gInterruptCode
# 0x03000C7C, sound code 0x03003B90/0x030041EC/0x03004294, clipdata
# 0x030016C4, Chozodia 0x03001730). The pinned generator aborts with
# "[finder] private CFG conflicts with public entry at 0x030041EC" /
# "ambiguous private CFG entry" and reports global data_range collisions.
# See docs/M4-NES-METROID.md (NES-2 blocker).
#
# Part 5 0x0600E474 (ldrne pc,[pc,r1,lsl #2] jump-table idiom, table at
# 0x0600E4C0) is not seeded: the generator starts an automatic function at the
# following beq whose not-taken edge enters the table bytes (hard data_range
# collision that exclude_func does not suppress). The block stays an
# uncovered strict-static frontier rather than code generated over data.

